# Temporary spike for E0-T05. Remove before merge if ADR-0015 is still proposed.
name: spike-e0-t05
on:
  push:
    branches: [spike/e0-t05-ui-tests]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: IdeWindowTest without display (expect skips)
        continue-on-error: true
        run: |
          mvn -B -ntp -pl ccmm-app -am test -Dtest=IdeWindowTest -Dsurefire.failIfNoSpecifiedTests=false | tee bare.log
          grep -E "Tests run: 6, .* Skipped: 6" bare.log
      - name: IdeWindowTest under xvfb-run
        run: |
          xvfb-run -a mvn -B -ntp -pl ccmm-app -am test -Dtest=IdeWindowTest -Dsurefire.failIfNoSpecifiedTests=false | tee xvfb.log
          grep -E "Tests run: 6, Failures: 0, Errors: 0, Skipped: 0" xvfb.log
