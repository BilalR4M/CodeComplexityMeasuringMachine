name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    # Integration only. Feature branches (feat/e1-t02-…) must not run the matrix on every push.
    branches: [main, feat/ccmm-ide]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Default for ordinary PRs: one Ubuntu job. Add the `ci-full` label for the 3-OS matrix.
  build-pr:
    name: build (ubuntu)
    if: github.event_name == 'pull_request' && !contains(join(github.event.pull_request.labels.*.name, ','), 'ci-full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: xvfb-run -a mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-ubuntu-latest
          path: "**/target/surefire-reports/**"

  build-full:
    name: build (${{ matrix.os }})
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'ci-full'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: verify (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn -B -ntp verify
      - name: verify
        if: runner.os != 'Linux'
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/target/surefire-reports/**"
